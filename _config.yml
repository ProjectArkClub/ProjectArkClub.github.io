title: 数码宝贝RPG助手
baseurl: "/"
url: "https://ProjectArkClub.github.io"
github_username: ProjectArkClub
cdn: ""
fastgit_url: https://global.digimon.pro/Download
google_analytics: G-Q0B9W70VGJ
projectArk_version: v4.765
projectArk_version_update: 2026/08/17

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og.png
        width: 1200
        height: 630
        alt: 推荐私有服务器使用 (Personal Server Recommended)

# Build settings
sass:
  style: compressed
kramdown:
  parse_block_html: true

plugins:
  - jekyll-sitemap

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Offline pages: keep source, stop publishing
  - dmo.md
  - gdmo
  - gh-proxy
  # Unreferenced heavy/legacy assets: keep source, stop publishing
  - image/bg1.png
  - image/bg2.png
  - resource/arch1.ico
  - resource/logo.ico
  - resource/init.png
  - resource/time.png
  - resource/rpg_load.png
  - resource/PreLoad.png
  - resource/DATS.png
  - resource/login.png
  - resource/Colo.png
  - resource/hide.png
  - resource/main.png
  - resource/Mail.png
  - resource/donate.png
  - resource/donate_ui.png
  - resource/account.png
  - resource/update_info.png
  - resource/item_data.png
  - resource/RPG_Requirement.png
  - resource/select_item_3.png
